services:
  - type: web
    name: entreggo-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: entreggo-cfef5
      - key: NOMINATIM_CONTACT
        sync: false
      - key: PRO_EMAILS
        value: marcellomatosxads@gmail.com,revisor.play@entreggo.app
